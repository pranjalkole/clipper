[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipper"
version = "0.1.0"
description = "Enterprise Multimodal Semantic Search & Agentic Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Multimodal Search Team" }
]
dependencies = [
    # Deep Learning & Vision-Language Embeddings
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.2.0",
    "open_clip_torch>=3.3.0",
    "timm>=1.0.29",
    "huggingface-hub>=0.23.0",
    "datasets>=2.19.0",

    # Vector Database
    "qdrant-client>=1.9.0",

    # Agentic Framework & Google Gemini LLM
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.1",

    # API & Validation
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",

    # Observability & Tracing
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
